<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
    <!-- UNA SOLA LÍNEA: Simple.css aplica diseño limpio y moderno automáticamente sin clases -->
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>

    <header>
        <h1>Crear Cuenta</h1>
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </header>

    <main>
        <form id="formularioRegistro">
            <label for="usuario">Nuevo Usuario:</label>
            <input type="text" id="usuario" required placeholder="Ej: usuario123">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required placeholder="Crea tu contraseña">

            <button type="submit">Registrarme</button>
        </form>
    </main>

    <!-- =========================================================
         JAVASCRIPT DIDÁCTICO PASO A PASO: REGISTRO DE USUARIO
         ========================================================= -->
    <script>
        // PASO 1: Interceptar el formulario cuando se presione "Registrarme"
        document.getElementById('formularioRegistro').addEventListener('submit', async function(evento) {
            
            // PASO 2: Evitamos que el navegador recargue la página
            evento.preventDefault();

            // PASO 3: Leemos los valores ingresados por el usuario
            const usuarioInput = document.getElementById('usuario').value;
            const passwordInput = document.getElementById('password').value;

            // PASO 4: Construimos el objeto JSON (coincide con RegistrarUsuarioRequest en C#)
            const payload = {
                Usuario: usuarioInput,
                Password: passwordInput
            };

            // PASO 5: Bloque try/catch para controlar fallos de red
            try {
                // PASO 6: Enviamos la petición POST a la ruta de RegistrarUsuario en el puerto 5059
                const respuesta = await fetch('http://localhost:5059/api/Usuario/RegistrarUsuario', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const resultado = await respuesta.json();

                // PASO 7: Si el registro fue exitoso (200 OK)
                if (respuesta.ok) {
                    alert("✅ " + resultado.mensaje);

                    // Redirigimos al usuario a la página de login para que inicie sesión
                    window.location.href = "login.html";

                } else {
                    // Si la API devolvió BadRequest (400)
                    alert("⚠️ " + resultado.mensaje);
                }

            } catch (error) {
                console.error("Error de conexión:", error);
                alert("❌ No se pudo conectar con la API. Revisa que el backend esté corriendo en http://localhost:5059");
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requerimientos</title>
    <!-- Simple.css para diseño limpio automático -->
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>

    <header>
        <h1>Panel de Operaciones</h1>
        <nav>
            <a href="#" id="btnCerrarSesion">Cerrar Sesión</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tus requerimientos aquí</h2>
            <p>Aquí puedes agregar los formularios o tablas de tus operaciones.</p>
        </section>
    </main>

    <script>
        // PASO 1: Guardia de seguridad - Verificar si existe el token en el navegador
        const token = localStorage.getItem('token');
        if (!token) {
            alert("⛔ Acceso denegado. Debes iniciar sesión primero.");
            window.location.href = "login.html";
        }

        // Botón simple para cerrar sesión y limpiar el token
        document.getElementById('btnCerrarSesion').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            alert("Has cerrado sesión.");
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
